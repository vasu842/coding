<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVPCET B.Tech 2nd Year Results Portal (R23)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone for browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Sample SVPCET R23 Student Database
        const STUDENT_DATABASE = {
          "23G01A4301": {
            rollNumber: "23G01A4301",
            name: "K. SAI KUMAR",
            branch: "Artificial Intelligence (AI)",
            yearSem: "B.Tech II Year - I Semester",
            regulation: "R23",
            college: "Sri Venkatesa Perumal College of Engineering & Technology (SVPCET)",
            status: "PASSED",
            sgpa: 8.52,
            cgpa: 8.35,
            subjects: [
              { code: "23ABS13", name: "Discrete Mathematics & Graph Theory", credits: 3, grade: "A+", status: "P" },
              { code: "23AHS04", name: "Universal Human Values - 2", credits: 3, grade: "A", status: "P" },
              { code: "23AEC05", name: "Digital Logic & Computer Organization", credits: 3, grade: "O", status: "P" },
              { code: "23ACS05T", name: "Advanced Data Structures & Algorithms", credits: 3, grade: "A+", status: "P" },
              { code: "23ACS06T", name: "Object Oriented Programming Through Java", credits: 3, grade: "O", status: "P" },
              { code: "23ACS05P", name: "Advanced Data Structures Lab", credits: 1.5, grade: "O", status: "P" },
              { code: "23ACS06P", name: "Java Programming Lab", credits: 1.5, grade: "A+", status: "P" }
            ]
          },
          "23G01A0502": {
            rollNumber: "25g01a4301",
            name: "M. PRIYA SHARMA",
            branch: "Computer Science & Engineering (CSE)",
            yearSem: "B.Tech II Year - I Semester",
            regulation: "R23",
            college: "Sri Venkatesa Perumal College of Engineering & Technology (SVPCET)",
            status: "PASSED",
            sgpa: 8.10,
            cgpa: 8.02,
            subjects: [
              { code: "25g01a4302", name: "Discrete Mathematics & Graph Theory", credits: 3, grade: "A", status: "P" },
              { code: "25g01a4303", name: "Universal Human Values - 2", credits: 3, grade: "B+", status: "P" },
              { code: "25g01a4304", name: "Digital Logic & Computer Organization", credits: 3, grade: "A", status: "P" },
              { code: "25g01a4305", name: "Advanced Data Structures & Algorithms", credits: 3, grade: "A+", status: "P" },
              { code: "25g01a4306", name: "Object Oriented Programming Through Java", credits: 3, grade: "A", status: "P" },
              { code: "25g01a4307", name: "Advanced Data Structures Lab", credits: 1.5, grade: "O", status: "P" },
              { code: "25g01a4308", name: "Java Programming Lab", credits: 1.5, grade: "O", status: "P" }
            ]
          }
        };

        function App() {
          const [searchInput, setSearchInput] = useState('');
          const [selectedSem, setSelectedSem] = useState('2-1');
          const [resultData, setResultData] = useState(null);
          const [errorMsg, setErrorMsg] = useState('');

          const handleSearch = (e) => {
            e.preventDefault();
            const cleanRoll = searchInput.trim().toUpperCase();

            if (!cleanRoll) {
              setErrorMsg('Please enter a valid Roll Number / Hall Ticket Number.');
              setResultData(null);
              return;
            }

            if (STUDENT_DATABASE[cleanRoll]) {
              setResultData(STUDENT_DATABASE[cleanRoll]);
              setErrorMsg('');
            } else {
              setErrorMsg(`No 2nd Year B.Tech (R23) results found for Roll Number: "${cleanRoll}".`);
              setResultData(null);
            }
          };

          const handleReset = () => {
            setSearchInput('');
            setResultData(null);
            setErrorMsg('');
          };

          return (
            <div className="min-h-screen flex flex-col justify-between">
              {/* Header */}
              <header className="bg-gradient-to-r from-blue-950 via-indigo-900 to-slate-900 text-white shadow-lg print:hidden">
                <div className="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between gap-4">
                  <div className="flex items-center space-x-4">
                    <div className="w-14 h-14 bg-white text-blue-900 rounded-full flex items-center justify-center font-extrabold text-xl shadow-inner border-2 border-amber-400">
                      SVPCET
                    </div>
                    <div>
                      <h1 className="text-xl md:text-2xl font-black tracking-wide">SVPCET EXAMINATION PORTAL</h1>
                      <p className="text-xs text-blue-200 mt-0.5">Sri Venkatesa Perumal College of Engineering & Technology</p>
                    </div>
                  </div>
                  <div className="bg-blue-800/60 border border-blue-700/50 rounded-xl px-4 py-2 text-center md:text-right">
                    <span className="text-xs text-amber-300 font-semibold uppercase tracking-wider block">Academic Scheme</span>
                    <span className="text-sm font-bold text-white">B.Tech 2nd Year Regular Results (R23)</span>
                  </div>
                </div>
              </header>

              {/* Search Section & Main Content */}
              <main className="flex-grow max-w-5xl w-full mx-auto px-4 py-8">
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8 print:hidden">
                  <h2 className="text-lg font-bold text-slate-800 mb-1">Check SVPCET B.Tech Results</h2>
                  <p className="text-xs text-slate-500 mb-6">Enter your 10-digit Hall Ticket / Roll Number to view R23 Regulation statement of marks.</p>

                  <form onSubmit={handleSearch} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 uppercase mb-2">Select Semester</label>
                      <select
                        value={selectedSem}
                        onChange={(e) => setSelectedSem(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-600"
                      >
                        <option value="2-1">B.Tech II Year I Semester (2-1) - R23</option>
                        <option value="2-2">B.Tech II Year II Semester (2-2) - R23</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 uppercase mb-2">Roll Number / Hall Ticket</label>
                      <input
                        type="text"
                        placeholder="e.g. 23G01A4301"
                        value={searchInput}
                        onChange={(e) => setSearchInput(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm font-semibold text-slate-800 uppercase focus:outline-none focus:ring-2 focus:ring-blue-600"
                      />
                    </div>

                    <div className="flex items-end gap-2">
                      <button
                        type="submit"
                        className="flex-1 bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 px-6 rounded-xl transition duration-150 shadow-md text-sm"
                      >
                        Get Results
                      </button>
                      {resultData && (
                        <button
                          type="button"
                          onClick={handleReset}
                          className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-4 rounded-xl transition text-sm"
                        >
                          Clear
                        </button>
                      )}
                    </div>
                  </form>

                  <div className="mt-4 pt-4 border-t border-slate-100 flex flex-wrap items-center gap-2 text-xs text-slate-500">
                    <span className="font-semibold">Sample R23 Roll Numbers:</span>
                    <button onClick={() => setSearchInput("23G01A4301")} className="bg-blue-50 text-blue-700 px-2 py-1 rounded font-mono hover:underline">23G01A4301 (AI)</button>
                    <button onClick={() => setSearchInput("23G01A0502")} className="bg-blue-50 text-blue-700 px-2 py-1 rounded font-mono hover:underline">23G01A0502 (CSE)</button>
                  </div>
                </div>

                {/* Error Banner */}
                {errorMsg && (
                  <div className="bg-rose-50 border-l-4 border-rose-500 p-4 rounded-xl mb-8 flex items-center justify-between">
                    <div className="flex items-center space-x-3">
                      <span className="text-rose-600 font-bold text-lg">⚠️</span>
                      <p className="text-sm font-semibold text-rose-800">{errorMsg}</p>
                    </div>
                  </div>
                )}

                {/* Results Card */}
                {resultData && (
                  <div className="bg-white rounded-2xl shadow-md border border-slate-300 overflow-hidden print:shadow-none print:border-none">
                    <div className="bg-slate-900 text-white p-6 border-b-4 border-amber-400">
                      <div className="flex justify-between items-start">
                        <div>
                          <h2 className="text-xl md:text-2xl font-black tracking-tight">{resultData.college}</h2>
                          <p className="text-xs text-slate-300 mt-1 uppercase font-semibold tracking-wider">Official Statement of Marks & Grade Card</p>
                        </div>
                        <button
                          onClick={() => window.print()}
                          className="print:hidden bg-amber-400 hover:bg-amber-500 text-slate-950 px-4 py-2 rounded-lg font-bold text-xs shadow-sm transition"
                        >
                          🖨️ Print Memo
                        </button>
                      </div>
                    </div>

                    {/* Student Metadata */}
                    <div className="p-6 bg-slate-50/50 border-b border-slate-200">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-y-3 gap-x-8 text-sm">
                        <div className="flex justify-between border-b border-slate-200 pb-2">
                          <span className="text-slate-500 font-medium">Student Name:</span>
                          <span className="font-bold text-slate-900">{resultData.name}</span>
                        </div>
                        <div className="flex justify-between border-b border-slate-200 pb-2">
                          <span className="text-slate-500 font-medium">Roll / HT Number:</span>
                          <span className="font-mono font-bold text-blue-700">{resultData.rollNumber}</span>
                        </div>
                        <div className="flex justify-between border-b border-slate-200 pb-2">
                          <span className="text-slate-500 font-medium">Branch / Specialization:</span>
                          <span className="font-semibold text-slate-800">{resultData.branch}</span>
                        </div>
                        <div className="flex justify-between border-b border-slate-200 pb-2">
                          <span className="text-slate-500 font-medium">Semester / Regulation:</span>
                          <span className="font-semibold text-slate-800">{resultData.yearSem} ({resultData.regulation})</span>
                        </div>
                      </div>
                    </div>

                    {/* Subject Marks Table */}
                    <div className="p-6 overflow-x-auto">
                      <table className="w-full text-left border-collapse text-xs md:text-sm">
                        <thead>
                          <tr className="bg-slate-100 text-slate-700 uppercase font-bold border-b-2 border-slate-300">
                            <th className="py-3 px-4">Subject Code</th>
                            <th className="py-3 px-4">Subject Name</th>
                            <th className="py-3 px-4 text-center">Credits</th>
                            <th className="py-3 px-4 text-center">Grade</th>
                            <th className="py-3 px-4 text-center">Result</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200 font-medium text-slate-800">
                          {resultData.subjects.map((sub, idx) => (
                            <tr key={idx} className="hover:bg-slate-50">
                              <td className="py-3 px-4 font-mono text-slate-600">{sub.code}</td>
                              <td className="py-3 px-4 font-semibold">{sub.name}</td>
                              <td className="py-3 px-4 text-center">{sub.credits}</td>
                              <td className="py-3 px-4 text-center font-bold text-indigo-700">{sub.grade}</td>
                              <td className="py-3 px-4 text-center">
                                <span className={`px-2 py-1 rounded text-xs font-bold ${sub.status === 'P' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                  {sub.status === 'P' ? 'PASS' : 'FAIL'}
                                </span>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    {/* Footer Summary */}
                    <div className="p-6 bg-slate-900 text-white flex flex-col md:flex-row items-center justify-between gap-4">
                      <div className="flex items-center space-x-6">
                        <div>
                          <span className="text-xs text-slate-400 uppercase font-semibold block">Semester SGPA</span>
                          <span className="text-2xl font-black text-amber-400">{resultData.sgpa}</span>
                        </div>
                        <div className="border-l border-slate-700 pl-6">
                          <span className="text-xs text-slate-400 uppercase font-semibold block">Cumulative CGPA</span>
                          <span className="text-2xl font-black text-blue-400">{resultData.cgpa}</span>
                        </div>
                      </div>

                      <div className="flex items-center space-x-3">
                        <span className="text-xs uppercase font-semibold text-slate-400">Overall Result:</span>
                        <span className="bg-emerald-500 text-slate-950 font-black px-4 py-2 rounded-lg text-sm tracking-wide">
                          {resultData.status}
                        </span>
                      </div>
                    </div>
                  </div>
                )}
              </main>

              {/* Footer */}
              <footer className="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800 print:hidden">
                <p>© 2026 Sri Venkatesa Perumal College of Engineering & Technology (SVPCET). All Rights Reserved.</p>
              </footer>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
