<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVPCET - R23 AI Attendance Portal</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- face-api.js: detects real faces in the camera image -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useMemo } = React;

    // ===== CAMPUS LOCATION SETTINGS =====
    // SVPCET = Sri Venkatesa Perumal College of Engineering & Technology, K.N. Road, Puttur (AP)
    // IMPORTANT: these two numbers are only an APPROXIMATE point for Puttur.
    // Replace them with the exact GPS point of your college / classroom block
    // (Google Maps: right-click the college -> click the numbers to copy).
    const SVPCET_LAT = 13.4405;
    const SVPCET_LNG = 79.5545;
    // Attendance opens only when the student is within this many METERS of the point above
    const MAX_RADIUS_METERS = 10;

    // Storage keys
    const HISTORY_KEY = 'attendance_history_v3';   // { "YYYY-MM-DD": { rollNo: 'Present' | 'Absent' } }
    const PASSWORDS_KEY = 'student_passwords';     // { rollNo: password }

    // Face detection model files (tried in this order until one loads)
    const MODEL_URLS = [
      'https://justadudewhohacks.github.io/face-api.js/models',
      'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights',
      'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights'
    ];

    // Regular students: roll numbers 25G01A4301 ... 25G01A4388 (in this order)
    const REGULAR_NAMES = [
      "A B SURESH", "A G JAMUNA", "A M DHANUSH", "A P YAMINI", "A PREETHI",
      "A VISHNUVARDHAN", "AAVULA DHARANI YADAV", "ALLUGANTI VARUN KUMAR REDDY",
      "AMBATI AJURI LAKSHMI POOJITHA", "ANDHI NAGA PRANATHI", "ANGITEELA BHAVANA",
      "ARAVA SOUJANYA", "ARDHAMALA SASI KUMAR", "ATTUKARA YAGNITHA", "AYYAPPA YUVANSANKAR",
      "B JHANSI", "B SHALINI", "BALA KOWSHIK YADAV", "BATTI SIVAKESAVULU", "BODIREDDY LOHITHA",
      "BORRA LALASA", "BOYA VENU", "BUDAGA VINOD", "BUSUPALLI ARUN KUMAR REDDY", "C DILLI BABU",
      "C S PRAVALIKA", "CHADALAVADA YASASWINI", "CHILLA PRAVEEN", "CHINNAGOVINDAPPAGARI DIVYA",
      "CHITAMBALAM VAMSIKRISHNA", "CHITTEMREDDY RAJESH REDDY", "CHITTOORU GEREESHMA", "D SINDHU",
      "DASARI PRAVEEN BABU", "DEVALLA GUNASRI", "DEVARAKONDA MOHITH", "DHANTLA HARIKA",
      "DONDU LALITHKUMAR", "DONGARA VENU", "DUDEKULA BASHEER", "DUGGULURU SPANDANA", "E RUSHITHA",
      "ERASAPPA RAKSHITHA", "G CHETHAN", "GAJJAPPAGARI SIDDARTHA", "GANAPARTHI MOUNIKA",
      "GANDLA DHANALAKSHMI", "GANGA RANGA SWAMY", "GANJI JASVANTH REDDY", "GATTU DHANUSH",
      "GIDDALURU GANGA VYSHNAVI", "GUDE HARSHITHA", "GUMMAKONDA SATHISH KUMAR", "GUNDURU PAVANI",
      "GURRAMKONDA BHARATH REDDY", "HEMACHANDRAN GANGOTHRI", "INDUKURI PREM SWAROOP", "K DIVYA",
      "K G JANSI RANI", "KASANURU SIDDARTHA", "KAMALAPADU ANAND", "K. LAKSHMI PRASANNA",
      "KAMASANI YASWANI", "KAMINI SHIREESHA", "KANAPALA JAHNAVI", "KANAPARTHI AMULYA",
      "KANDI CHARANTEJA", "KARPURAPU SRI PAVANI", "KATTUBADI KIRAN KUMAR", "KEELAPUDI VASUDEVA",
      "KEESALAM PAVANI", "KONERU JAHNAVI", "KOPPALA LOHITHA", "KOTHAPALLI SAHITHYA",
      "K. VIJAYKUMAR", "K. MANJUNADH", "K. SAI VENNELA", "K. PRAVEEN KUMAR REDDY",
      "K. VENKATESULU", "K. SONAL", "M. AJAY KUMAR", "M. GIRIPRASAD", "M. K. GOVINDA SWAMY",
      "M. M. SURYA", "M. MADHAVI", "M. MAHALAKSHMI", "M. MANOHAR", "M. MEGALA"
    ];

    // Lateral entry students
    const LATERAL_ENTRY = [
      { rollNo: "LE1", name: "G. LOHITH" },
      { rollNo: "LE2", name: "T. VEERA SIDDU SREE" },
      { rollNo: "LE3", name: "K. SOUMYA (28/8)" },
      { rollNo: "LE4", name: "P. SIRI (28/8)" }
    ];

    // Student master list: only roll number + name. Attendance counts are calculated
    // from the attendance history, so every student starts at 0 Present / 0 Absent.
    const STUDENTS = [
      ...REGULAR_NAMES.map((name, i) => ({
        rollNo: "25G01A43" + String(i + 1).padStart(2, '0'),
        name
      })),
      ...LATERAL_ENTRY
    ];

    // Today's date as YYYY-MM-DD (local time)
    const getTodayKey = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const loadJSON = (key) => {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    };

    // Read the device GPS (high accuracy, never a cached position)
    const getPosition = () => new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject({ code: 'unsupported' });
        return;
      }
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      });
    });

    const formatDistance = (meters) =>
      meters < 1000 ? `${Math.round(meters)} m` : `${(meters / 1000).toFixed(1)} km`;

    function App() {
      const [role, setRole] = useState(null);
      const [currentUser, setCurrentUser] = useState(null);
      const [rollNo, setRollNo] = useState('');
      const [password, setPassword] = useState('');

      // { "YYYY-MM-DD": { rollNo: 'Present' | 'Absent' } }
      const [history, setHistory] = useState(() => loadJSON(HISTORY_KEY));
      const [passwordsMap, setPasswordsMap] = useState(() => loadJSON(PASSWORDS_KEY));
      const [isFirstTime, setIsFirstTime] = useState(false);
      const [newPassword, setNewPassword] = useState('');
      const [pendingStudent, setPendingStudent] = useState(null);

      const [locationVerified, setLocationVerified] = useState(false);
      const [userCoords, setUserCoords] = useState(null);
      const [locationChecking, setLocationChecking] = useState(false);
      const [gpsInfo, setGpsInfo] = useState('');
      const [verifying, setVerifying] = useState(false);
      const [statusMessage, setStatusMessage] = useState('');

      // Face detection state
      const [modelStatus, setModelStatus] = useState('idle'); // idle | loading | ready | failed
      const [cameraReady, setCameraReady] = useState(false);
      const [faceCount, setFaceCount] = useState(0);          // faces currently seen by the camera

      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const modelsLoadedRef = useRef(false);
      const verifyingRef = useRef(false);
      const scanTokenRef = useRef(0);

      // Save attendance history whenever it changes
      useEffect(() => {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      }, [history]);

      // Save passwords whenever they change
      useEffect(() => {
        localStorage.setItem(PASSWORDS_KEY, JSON.stringify(passwordsMap));
      }, [passwordsMap]);

      // Remove the old key from the previous version (it caused wrong counts)
      useEffect(() => {
        localStorage.removeItem('today_frs_attendance');
      }, []);

      const todayKey = getTodayKey();
      const todayAttendance = history[todayKey] || {};

      // Present / Absent totals for every student, calculated from the history
      const stats = useMemo(() => {
        const map = {};
        STUDENTS.forEach(s => { map[s.rollNo] = { present: 0, absent: 0 }; });
        Object.values(history).forEach(day => {
          Object.entries(day).forEach(([roll, status]) => {
            if (!map[roll]) return;
            if (status === 'Present') map[roll].present++;
            else if (status === 'Absent') map[roll].absent++;
          });
        });
        return map;
      }, [history]);

      const calculateDistance = (lat1, lon1, lat2, lon2) => {
        const R = 6371;
        const dLat = (lat2 - lat1) * (Math.PI / 180);
        const dLon = (lon2 - lon1) * (Math.PI / 180);
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
          Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const inputRoll = rollNo.trim().toUpperCase();

        if (inputRoll === 'HOD' && password === 'admin123') {
          setRole('hod');
          setCurrentUser({ name: 'Head of Department (AI)' });
          return;
        }

        const student = STUDENTS.find(s => s.rollNo.toUpperCase() === inputRoll);
        if (!student) {
          alert('Roll Number not found in database!');
          return;
        }

        const savedPass = passwordsMap[student.rollNo];

        if (!savedPass) {
          setPendingStudent(student);
          setIsFirstTime(true);
        } else {
          if (password === savedPass) {
            setRole('student');
            setCurrentUser(student);
            verifyLocation();
          } else {
            alert('Incorrect password! Please enter your own password.');
          }
        }
      };

      const handleSetPassword = (e) => {
        e.preventDefault();
        if (newPassword.trim().length < 4) {
          alert('Password must be at least 4 characters long.');
          return;
        }

        setPasswordsMap(prev => ({ ...prev, [pendingStudent.rollNo]: newPassword.trim() }));

        alert('Password created successfully! Logging in...');
        setIsFirstTime(false);
        setRole('student');
        setCurrentUser(pendingStudent);
        setPendingStudent(null);
        setNewPassword('');
        setPassword('');
        verifyLocation();
      };

      const handleResetPassword = (studentRoll) => {
        if (confirm(`Reset password for Roll No: ${studentRoll}?`)) {
          setPasswordsMap(prev => {
            const updated = { ...prev };
            delete updated[studentRoll];
            return updated;
          });
        }
      };

      // Set (or clear) one student's status for today.
      // Clicking the already-selected button removes today's mark again.
      const setTodayStatus = (studentRoll, status) => {
        const key = getTodayKey();
        setHistory(prev => {
          const day = { ...(prev[key] || {}) };
          if (status === null || day[studentRoll] === status) {
            delete day[studentRoll];
          } else {
            day[studentRoll] = status;
          }
          return { ...prev, [key]: day };
        });
      };

      // Used by the student's own FRS check: always sets Present (never toggles off)
      const markPresentForStudent = (studentRoll) => {
        const key = getTodayKey();
        setHistory(prev => ({
          ...prev,
          [key]: { ...(prev[key] || {}), [studentRoll]: 'Present' }
        }));
      };

      const markAllToday = (status) => {
        const key = getTodayKey();
        setHistory(prev => {
          const day = { ...(prev[key] || {}) };
          STUDENTS.forEach(s => { day[s.rollNo] = status; });
          return { ...prev, [key]: day };
        });
      };

      const clearToday = () => {
        if (confirm("Clear all of today's marks? (Previous days are not affected)")) {
          const key = getTodayKey();
          setHistory(prev => {
            const updated = { ...prev };
            delete updated[key];
            return updated;
          });
        }
      };

      const resetAllAttendance = () => {
        if (confirm('Reset ALL attendance records for ALL students back to 0 Present / 0 Absent? This cannot be undone.')) {
          setHistory({});
        }
      };

      // Checks the GPS and decides if the student is within MAX_RADIUS_METERS of the campus point
      const checkCampusLocation = async () => {
        try {
          const pos = await getPosition();
          const { latitude, longitude, accuracy } = pos.coords;
          const distance = calculateDistance(latitude, longitude, SVPCET_LAT, SVPCET_LNG) * 1000; // km -> m
          return { ok: distance <= MAX_RADIUS_METERS, distance, accuracy, lat: latitude, lng: longitude };
        } catch (err) {
          let error = 'unavailable';
          if (err && err.code === 'unsupported') error = 'unsupported';
          else if (err && err.code === 1) error = 'denied';
          else if (err && err.code === 3) error = 'timeout';
          return { ok: false, error };
        }
      };

      const locationMessage = (r) => {
        if (r.error === 'denied') return 'Location permission denied. Allow location access in the browser, then press "Retry location check".';
        if (r.error === 'unsupported') return 'This device/browser does not support GPS. Attendance cannot be marked.';
        if (r.error === 'timeout') return 'Could not get your GPS location in time. Turn on device location (go outdoors if needed) and retry.';
        if (r.error) return 'GPS location is unavailable. Turn on device location and retry.';
        return `You are ${formatDistance(r.distance)} away from SVPCET Puttur. Attendance opens only within ${MAX_RADIUS_METERS} m of the college. (GPS accuracy ±${Math.round(r.accuracy)} m)`;
      };

      const verifyLocation = async () => {
        const token = scanTokenRef.current;
        setLocationVerified(false);
        setLocationChecking(true);
        setStatusMessage('Checking your GPS location... please allow location access.');

        const r = await checkCampusLocation();
        if (token !== scanTokenRef.current) return; // logged out meanwhile
        setLocationChecking(false);

        if (r.ok) {
          setUserCoords({ lat: r.lat, lng: r.lng });
          setLocationVerified(true);
          setStatusMessage(`Location verified: ${formatDistance(r.distance)} from SVPCET Puttur (allowed: ${MAX_RADIUS_METERS} m, GPS accuracy ±${Math.round(r.accuracy)} m).`);
        } else {
          setLocationVerified(false);
          setStatusMessage(locationMessage(r));
        }
      };

      // Helper for the login page: shows the current GPS numbers so you can copy them into the code
      const showMyCoordinates = async () => {
        setGpsInfo('Getting your GPS location...');
        try {
          const pos = await getPosition();
          const { latitude, longitude, accuracy } = pos.coords;
          const d = calculateDistance(latitude, longitude, SVPCET_LAT, SVPCET_LNG) * 1000;
          setGpsInfo(`Your location: ${latitude.toFixed(6)}, ${longitude.toFixed(6)} (±${Math.round(accuracy)} m). Distance from the campus point set in the code: ${formatDistance(d)}.`);
        } catch (err) {
          setGpsInfo('Could not read GPS. Allow location access in the browser and try again.');
        }
      };

      // Has this student already been marked Present today?
      const alreadyMarked = !!currentUser && todayAttendance[currentUser.rollNo] === 'Present';

      // Start the camera only after the <video> element exists, and stop it when not needed
      useEffect(() => {
        let cancelled = false;
        const shouldRun = role === 'student' && locationVerified && !alreadyMarked;

        if (shouldRun) {
          (async () => {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ video: true });
              if (cancelled) {
                stream.getTracks().forEach(t => t.stop());
                return;
              }
              streamRef.current = stream;
              if (videoRef.current) {
                videoRef.current.srcObject = stream;
              }
            } catch (err) {
              console.error('Camera access error:', err);
              setStatusMessage('Camera not available. Please allow camera access (use https:// or localhost).');
            }
          })();
        }

        return () => {
          cancelled = true;
          setCameraReady(false);
          setFaceCount(0);
          if (streamRef.current) {
            streamRef.current.getTracks().forEach(t => t.stop());
            streamRef.current = null;
          }
        };
      }, [role, locationVerified, alreadyMarked]);

      // Load the face detection model (once) after the student logs in
      const loadFaceModels = async () => {
        if (modelsLoadedRef.current) {
          setModelStatus('ready');
          return;
        }
        if (typeof faceapi === 'undefined') {
          setModelStatus('failed');
          return;
        }
        setModelStatus('loading');
        for (const url of MODEL_URLS) {
          try {
            await faceapi.nets.tinyFaceDetector.loadFromUri(url);
            modelsLoadedRef.current = true;
            setModelStatus('ready');
            return;
          } catch (err) {
            console.error('Face model failed to load from', url, err);
          }
        }
        setModelStatus('failed');
      };

      useEffect(() => {
        if (role === 'student' && locationVerified) {
          loadFaceModels();
        }
      }, [role, locationVerified]);

      // Look at the current camera frame and return the list of real faces found.
      // Returns null if the camera is not producing video yet.
      const detectFaces = async () => {
        const video = videoRef.current;
        if (!video || video.readyState
