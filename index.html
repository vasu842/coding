<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyAI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app" id="app">

    <aside class="sidebar">
      <div class="brand-row">
        <div class="logo-box">✦</div>
        <div class="brand-text">
          <div class="brand">MyAI <span class="pro">PRO</span></div>
          <div id="status" class="status">● Checking...</div>
        </div>
        <button class="icon-btn toggle" title="Close sidebar">⇤</button>
      </div>

      <button id="newChat" class="primary">＋ New Session</button>

      <input id="searchChats" class="search" type="text" placeholder="Search chats..." autocomplete="off">

      <p class="side-title" id="recentTitle">RECENT (0)</p>
      <div id="historyList" class="history"></div>

      <div class="side-bottom">
        <div class="info"><span>Active Persona:</span><b id="personaName">J.A.R.V.I.S.</b></div>
        <button id="clearAll" class="link-btn">🗑 Clear Conversations</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn toggle" title="Toggle sidebar">☰</button>

        <select id="personaSelect" class="select">
          <option value="jarvis">J.A.R.V.I.S.</option>
          <option value="teacher">Teacher</option>
          <option value="coder">Coder</option>
          <option value="friend">Friend</option>
        </select>

        <select id="modelSelect" class="select"></select>

        <span class="spacer"></span>

        <button id="themeButton" class="icon-btn" title="Change theme">☀</button>
      </header>

      <section id="chat" class="chat"></section>

      <div class="composer-wrap">
        <form id="chatForm" class="composer">
          <textarea id="messageInput" rows="1" placeholder="Message..."></textarea>
          <button id="micButton" type="button" class="icon-btn" title="Speak">🎤</button>
          <button id="sendButton" type="submit" title="Send">➤</button>
        </form>
        <p class="disclaimer">MyAI can make mistakes. Check important information.</p>
      </div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
