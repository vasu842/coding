<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyAI Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>MyAI</h1>
            <span>AI Assistant</span>
        </header>

        <main id="chat">

            <div class="welcome">
                <h2>How can I help you?</h2>
                <p>Ask me anything.</p>
            </div>

        </main>

        <form id="chatForm">

            <input
                id="messageInput"
                type="text"
                placeholder="Message MyAI..."
                autocomplete="off"
            >

            <button type="submit">
                Send
            </button>

        </form>

    </div>

    <script src="app.js"></script>

</body>
</html>
