<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Portal with FRS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Face-API.js for Face Recognition -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        const RAW_STUDENT_NAMES = [
            "A B SURESH", "A G JAMUNA", "A M DHANUSH", "A P YAMINI", "A PREETHI", 
            "A VISHNUVARDHAN", "AVULA DHARANI YADAV", "ALLUGANTI VARUN KUMAR REDDY", "AMBATI AJURI LAKSHMI POOJITHA", "ANDHI NAGA PRANATHI", 
            "ANGITEELA BHAVANA", "ARAVA SOUJANYA", "ARDHAMALA SASI KUMAR", "ATTUKARA YAGNITHA", "AYYAPPA YUVANSANKAR", 
            "B JHANSI", "B SHALINI", "BALA KOWSHIK YADAV", "BATTI SIVAKESAVULU", "BODIREDDY LOHITHA", 
            "BORRA LALASA", "BOYA VENU", "BUDAGA VINOD", "BUSUPALLI ARUN KUMAR REDDY", "C DILLI BABU", 
            "C S PRAVALIKA", "CHADALAVADA YASASWINI", "CHILLA PRAVEEN", "CHINNAGOVINDAPPAGARI DIVYA", "CHITAMBALAM VAMSIKRISHNA", 
            "CHITTEMREDDY RAJESH REDDY", "CHITTOORU GEREESHMA", "D SINDHU", "DASARI PRAVEEN BABU", "DEVALLA GUNASRI", 
            "DEVARAKONDA MOHITH", "DHANTLA HARIKA", "DONDU LALITHKUMAR", "DONGARA VENU", "DUDEKULA BASHEER", 
            "DUGGULURU SPANDANA", "E RUSHITHA", "ERASAPPA RAKSHITHA", "G CHETHAN", "GAJJAPPAGARI SIDDARTHA", 
            "GANAPARTHI MOUNIKA", "GANDLA DHANALAKSHMI", "GANGA RANGA SWAMY", "GANJI JASVANTH REDDY", "GATTU DHANUSH", 
            "GIDDALURU GANGA VYSHNAVI", "GUDE HARSHITHA", "GUMMAKONDA SATHISH KUMAR", "GUNDURU PAVANI", "GURRAMKONDA BHARATH REDDY", 
            "HEMACHANDRAN GANGOTHRI", "INDUKURI PREM SWAROOP", "K DIVYA", "K G JANSI RANI", "KASANURU SIDDARTHA", 
            "KAMALAPADU ANAND", "K. LAKSHMI PRASANNA", "KAMASANI YASWANI", "KAMINI SHIREESHA", "KANAPALA JAHNAVI", 
            "KANAPARTHI AMULYA", "KANDI CHARANTEJA", "KARPURAPU SRI PAVANI", "KATTUBADI KIRAN KUMAR", "KEELAPUDI VASUDEVA", 
            "KEESALAM PAVANI", "KONERU JAHNAVI", "KOPPALA LOHITHA", "KOTHAPALLI SAHITHYA", "K. VIJAYKUMAR", 
            "K.MANJUNADH", "k.sai vennela", "K.Praveen Kumar Reddy", "k venkatesulu", "k.sonal", 
            "M.ajay kumar", "M Giriprasad", "MK Govinda swamy", "M M Surya", "M madhavi", 
            "m mahalakshmi", "M manohar", "M .Megala"
        ];

        const RAW_LE_STUDENTS = [
            { roll: '25G01A43LE1', name: 'G Lohith' },
            { roll: '25G01A43LE2', name: 'T Veera Siddu Sree' },
            { roll: '25G01A43LE3', name: 'K Soumya' },
            { roll: '25G01A43LE4', name: 'P Siri' }
        ];

        const GENERATE_STUDENTS = () => {
            const list = RAW_STUDENT_NAMES.map((name, index) => {
                const num = (index + 1).toString().padStart(2, '0');
                return {
                    roll: `25G01A43${num}`,
                    name: name,
                    password: 'student123',
                    isFirstLogin: true,
                    status: 'Present',
                    presentDays: 18,
                    absentDays: 2,
                    faceDescriptor: null
                };
            });

            RAW_LE_STUDENTS.forEach((le) => {
                list.push({
                    roll: le.roll,
                    name: le.name,
                    password: 'student123',
                    isFirstLogin: true,
                    status: 'Present',
                    presentDays: 17,
                    absentDays: 3,
                    faceDescriptor: null
                });
            });

            return list;
        };

        function App() {
            const [students, setStudents] = useState(() => {
                const saved = localStorage.getItem('svpcet_students_db');
                return saved ? JSON.parse(saved) : GENERATE_STUDENTS();
            });

            const [currentUser, setCurrentUser] = useState(null);
            const [rollInput, setRollInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [loginError, setLoginError] = useState('');

            // Password Change Flow
            const [showChangePasswordModal, setShowChangePasswordModal] = useState(false);
            const [pendingStudent, setPendingStudent] = useState(null);
            const [newPassword, setNewPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [passwordModalError, setPasswordModalError] = useState('');

            // FRS State & References
            const [isModelsLoaded, setIsModelsLoaded] = useState(false);
            const [verifyingStudent, setVerifyingStudent] = useState(null);
            const [frsStatusMsg, setFrsStatusMsg] = useState('Loading Models...');
            const [isCapturingRegistration, setIsCapturingRegistration] = useState(false);
            
            const videoRef = useRef(null);
            const registrationVideoRef = useRef(null);

            const [searchQuery, setSearchQuery] = useState('');
            const [toastMessage, setToastMessage] = useState(null);

            // Load Face-API Neural Network Models
            useEffect(() => {
                const loadModels = async () => {
                    try {
                        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                        await Promise.all([
                            faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                            faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                            faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                        ]);
                        setIsModelsLoaded(true);
                        setFrsStatusMsg('FRS Engine Ready');
                    } catch (err) {
                        console.error('Error loading face-api models:', err);
                        setFrsStatusMsg('Failed to load Face Recognition models.');
                    }
                };
                loadModels();
            }, []);

            useEffect(() => {
                localStorage.setItem('svpcet_students_db', JSON.stringify(students));
            }, [students]);

            const handleLogin = (e) => {
                e.preventDefault();
                setLoginError('');

                const cleanRoll = rollInput.trim().toUpperCase();

                if (cleanRoll === 'HOD' && passwordInput === 'admin123') {
                    setCurrentUser({ role: 'hod', name: 'Head of Department' });
                    return;
                }

                const foundStudent = students.find(s => s.roll.toUpperCase() === cleanRoll);

                if (foundStudent) {
                    if (foundStudent.password === passwordInput) {
                        if (foundStudent.isFirstLogin || foundStudent.password === 'student123') {
                            setPendingStudent(foundStudent);
                            setShowChangePasswordModal(true);
                        } else {
                            setCurrentUser({ role: 'student', data: foundStudent });
                        }
                    } else {
                        setLoginError('Invalid password! If this is your first login, use "student123".');
                    }
                } else {
                    setLoginError('Roll Number not found. Check your input.');
                }
            };

            const handleSaveNewPassword = (e) => {
                e.preventDefault();
                setPasswordModalError('');

                if (newPassword.length < 6) {
                    setPasswordModalError('Password must be at least 6 characters long.');
                    return;
                }
                if (newPassword === 'student123') {
                    setPasswordModalError('Please choose a password different from default "student123".');
                    return;
                }
                if (newPassword !== confirmPassword) {
                    setPasswordModalError('New password and confirm password do not match.');
                    return;
                }

                const updatedStudent = {
                    ...pendingStudent,
                    password: newPassword,
                    isFirstLogin: false
                };

                setStudents(prev => prev.map(s => s.roll === pendingStudent.roll ? updatedStudent : s));
                setShowChangePasswordModal(false);
                setCurrentUser({ role: 'student', data: updatedStudent });
                showToast('Password updated successfully!');

                setNewPassword('');
                setConfirmPassword('');
                setPendingStudent(null);
            };

            // Register Student Face Descriptor
            const registerFace = async () => {
                if (!registrationVideoRef.current || !isModelsLoaded) return;
                setFrsStatusMsg('Scanning face...');

                const detection = await faceapi.detectSingleFace(
                    registrationVideoRef.current,
                    new faceapi.TinyFaceDetectorOptions()
                ).withFaceLandmarks().withFaceDescriptor();

                if (detection) {
                    const descriptorArray = Array.from(detection.descriptor);
                    const updatedUser = { ...currentUser.data, faceDescriptor: descriptorArray };

                    setStudents(prev => prev.map(s => s.roll === currentUser.data.roll ? updatedUser : s));
                    setCurrentUser({ ...currentUser, data: updatedUser });
                    
                    // Stop stream
                    if (registrationVideoRef.current.srcObject) {
                        registrationVideoRef.current.srcObject.getTracks().forEach(track => track.stop());
                    }
                    setIsCapturingRegistration(false);
                    showToast('Face registered successfully!');
                } else {
                    setFrsStatusMsg('No clear face detected. Ensure good lighting and alignment.');
                }
            };

            const startRegistrationCamera = async () => {
                setIsCapturingRegistration(true);
                setFrsStatusMsg('Align face in center of camera...');
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    if (registrationVideoRef.current) {
                        registrationVideoRef.current.srcObject = stream;
                    }
                } catch (err) {
                    setFrsStatusMsg('Camera access denied or unavailable.');
                }
            };

            // Verify Face for Attendance (Faculty Action)
            const openVerificationModal = async (student) => {
                if (!student.faceDescriptor) {
                    alert(`${student.name} has not registered their face profile yet.`);
                    return;
                }
                setVerifyingStudent(student);
                setFrsStatusMsg('Starting camera for verification...');
                
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    setTimeout(() => {
                        if (videoRef.current) {
                            videoRef.current.srcObject = stream;
                        }
                    }, 200);
                } catch (err) {
                    setFrsStatusMsg('Failed to open camera.');
                }
            };

            const processFaceMatch = async () => {
                if (!videoRef.current || !verifyingStudent) return;
                setFrsStatusMsg('Comparing face data...');

                const detection = await faceapi.detectSingleFace(
                    videoRef.current,
                    new faceapi.TinyFaceDetectorOptions()
                ).withFaceLandmarks().withFaceDescriptor();

                if (detection) {
                    const registeredDescriptor = new Float32Array(verifyingStudent.faceDescriptor);
                    const distance = faceapi.euclideanDistance(detection.descriptor, registeredDescriptor);

                    // Standard threshold for face-api euclidean distance is 0.6
                    if (distance < 0.55) {
                        handleStatusChange(verifyingStudent.roll, 'Present');
                        showToast(`Face Matched! ${verifyingStudent.name} marked PRESENT.`);
                        closeVerificationModal();
                    } else {
                        setFrsStatusMsg(`Face Match Failed (Distance: ${distance.toFixed(2)}). Access Denied.`);
                    }
                } else {
                    setFrsStatusMsg('No face detected in video frame.');
                }
            };

            const closeVerificationModal = () => {
                if (videoRef.current && videoRef.current.srcObject) {
                    videoRef.current.srcObject.getTracks().forEach(track => track.stop());
                }
                setVerifyingStudent(null);
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setRollInput('');
                setPasswordInput('');
                setLoginError('');
            };

            const handleStatusChange = (roll, newStatus) => {
                setStudents(prev => prev.map(s => s.roll === roll ? { ...s, status: newStatus } : s));
            };

            const handleAutoPresentAll = () => {
                setStudents(prev => prev.map(s => ({ ...s, status: 'Present' })));
                showToast('All students set to PRESENT');
            };

            const handleSilentAbsentAll = () => {
                setStudents(prev => prev.map(s => ({ ...s, status: 'Absent' })));
                showToast('All students set to ABSENT');
            };

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const filteredStudents = useMemo(() => {
                return students.filter(s =>
                    s.roll.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    s.name.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }, [students, searchQuery]);

            const presentCount = students.filter(s => s.status === 'Present').length;
            const absentCount = students.filter(s => s.status === 'Absent').length;

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-slate-900 text-white shadow-md sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="bg-indigo-600 p-2 rounded-lg font-bold text-lg">AI</div>
                                <div>
                                    <h1 className="text-lg font-bold leading-none">II B.Tech - I SEM (A-Sec)</h1>
                                    <p className="text-xs text-slate-400 mt-1">Dept. of Artificial Intelligence</p>
                                </div>
                            </div>

                            {currentUser && (
                                <button
                                    onClick={handleLogout}
                                    className="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-3.5 py-2 rounded-md transition"
                                >
                                    Logout
                                </button>
                            )}
                        </div>
                    </header>

                    {toastMessage && (
                        <div className="fixed bottom-4 right-4 z-50 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-2 border border-slate-700 animate-bounce">
                            <span className="text-emerald-400 font-bold">✓</span>
                            <span className="text-sm font-medium">{toastMessage}</span>
                        </div>
                    )}

                    {/* Change Password Modal */}
                    {showChangePasswordModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white max-w-md w-full rounded-2xl p-6 shadow-2xl border border-slate-100">
                                <div className="text-center mb-6">
                                    <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-2 font-bold text-xl">
                                        🔒
                                    </div>
                                    <h3 className="text-lg font-bold text-slate-800">First-Time Sign-In Detected</h3>
                                    <p className="text-xs text-slate-500 mt-1">
                                        Welcome, <span className="font-semibold text-slate-800">{pendingStudent?.name}</span> ({pendingStudent?.roll}). Please update your password to continue.
                                    </p>
                                </div>

                                {passwordModalError && (
                                    <div className="mb-4 p-2.5 bg-red-50 text-red-700 text-xs rounded-lg border border-red-200 font-medium">
                                        {passwordModalError}
                                    </div>
                                )}

                                <form onSubmit={handleSaveNewPassword} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">New Password</label>
                                        <input
                                            type="password"
                                            required
                                            placeholder="Enter new password (min 6 chars)"
                                            value={newPassword}
                                            onChange={(e) => setNewPassword(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Confirm New Password</label>
                                        <input
                                            type="password"
                                            required
                                            placeholder="Re-enter new password"
                                            value={confirmPassword}
                                            onChange={(e) => setConfirmPassword(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm shadow-md transition"
                                    >
                                        Save Password & Sign In
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* FRS Verification Modal */}
                    {verifyingStudent && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white max-w-lg w-full rounded-2xl p-6 shadow-2xl border border-slate-100 text-center">
                                <h3 className="text-lg font-bold text-slate-800 mb-1">Face Recognition Matching</h3>
                                <p className="text-xs text-slate-500 mb-4">Verifying identity for <span className="font-bold text-indigo-600">{verifyingStudent.name}</span> ({verifyingStudent.roll})</p>

                                <div className="relative w-full aspect-video bg-slate-900 rounded-xl overflow-hidden mb-4 flex items-center justify-center">
                                    <video ref={videoRef} autoPlay muted className="w-full h-full object-cover" />
                                </div>

                                <p className="text-xs font-medium text-slate-600 mb-4">{frsStatusMsg}</p>

                                <div className="flex gap-3 justify-center">
                                    <button
                                        onClick={processFaceMatch}
                                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold shadow-md"
                                    >
                                        Verify & Mark Present
                                    </button>
                                    <button
                                        onClick={closeVerificationModal}
                                        className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-bold"
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Main Content */}
                    <main className="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        {!currentUser ? (
                            <div className="max-w-md mx-auto my-12 bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
                                <div className="text-center mb-6">
                                    <div className="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-2xl">
                                        🎓
                                    </div>
                                    <h2 className="text-2xl font-bold text-slate-800">Student & Faculty Portal</h2>
                                    <p className="text-xs text-slate-500 mt-1">Enter Roll Number and Password to log in</p>
                                </div>

                                {loginError && (
                                    <div className="mb-4 p-3 bg-red-50 text-red-700 rounded-lg text-xs font-semibold border border-red-200 text-center">
                                        {loginError}
                                    </div>
                                )}

                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Roll Number / User ID</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="e.g. 25G01A4301 or HOD"
                                            value={rollInput}
                                            onChange={(e) => setRollInput(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
                                        <input
                                            type="password"
                                            required
                                            placeholder="••••••••"
                                            value={passwordInput}
                                            onChange={(e) => setPasswordInput(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-sm shadow-md transition cursor-pointer"
                                    >
                                        Sign In
                                    </button>
                                </form>

                                <div className="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-500 space-y-1">
                                    <p><span className="font-bold text-slate-700">First-Time Student Password:</span> student123</p>
                                    <p><span className="font-bold text-slate-700">HOD Admin Access:</span> HOD | admin123</p>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                {currentUser.role === 'student' ? (
                                    /* Student View */
                                    <div className="space-y-6">
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                            <div>
                                                <h2 className="text-xl font-bold text-slate-800">{currentUser.data.name}</h2>
                                                <p className="text-sm text-slate-500 font-mono mt-0.5">Roll No: {currentUser.data.roll}</p>
                                                <span className="inline-block mt-2 text-xs font-semibold px-2.5 py-1 bg-indigo-100 text-indigo-700 rounded-md">
                                                    Dept. of AI • Section A
                                                </span>
                                            </div>

                                            <div className="flex gap-4 w-full md:w-auto">
                                                <div className="bg-emerald-50 border border-emerald-100 p-4 rounded-xl text-center flex-1 md:flex-none min-w-[110px]">
                                                    <span className="text-xs font-bold text-emerald-600 uppercase block">Present</span>
                                                    <span className="text-2xl font-bold text-emerald-700">{currentUser.data.presentDays} Days</span>
                                                </div>
                                                <div className="bg-rose-50 border border-rose-100 p-4 rounded-xl text-center flex-1 md:flex-none min-w-[110px]">
                                                    <span className="text-xs font-bold text-rose-600 uppercase block">Absent</span>
                                                    <span className="text-2xl font-bold text-rose-700">{currentUser.data.absentDays} Days</span>
                                                </div>
                                                <div className="bg-blue-50 border border-blue-100 p-4 rounded-xl text-center flex-1 md:flex-none min-w-[110px]">
                                                    <span className="text-xs font-bold text-blue-600 uppercase block">Percentage</span>
                                                    <span className="text-2xl font-bold text-blue-700">
                                                        {((currentUser.data.presentDays / (currentUser.data.presentDays + currentUser.data.absentDays)) * 100).toFixed(0)}%
                                                    </span>
                                                </div>
                                            </div>
                                        </div>

                                        {/* FRS Registration Card for Student */}
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                            <h3 className="text-md font-bold text-slate-800 mb-2">Face Recognition Profile (FRS)</h3>
                                            {currentUser.data.faceDescriptor ? (
                                                <div className="flex items-center space-x-2 text-emerald-600 text-sm font-semibold">
                                                    <span>✓ Face Profile Registered</span>
                                                </div>
                                            ) : (
                                                <div>
                                                    <p className="text-xs text-slate-500 mb-4">Please register your face profile to enable automated facial verification during class attendance.</p>
                                                    {!isCapturingRegistration ? (
                                                        <button
                                                            onClick={startRegistrationCamera}
                                                            disabled={!isModelsLoaded}
                                                            className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white rounded-lg text-xs font-bold"
                                                        >
                                                            {isModelsLoaded ? 'Register Face via Webcam' : 'Loading Face AI Engines...'}
                                                        </button>
                                                    ) : (
                                                        <div className="space-y-3 max-w-sm">
                                                            <div className="aspect-video bg-black rounded-lg overflow-hidden">
                                                                <video ref={registrationVideoRef} autoPlay muted className="w-full h-full object-cover" />
                                                            </div>
                                                            <p className="text-xs text-slate-500">{frsStatusMsg}</p>
                                                            <button
                                                                onClick={registerFace}
                                                                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold w-full"
                                                            >
                                                                Capture & Save Profile
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ) : (
                                    /* Faculty / Admin Attendance Management View */
                                    <div className="space-y-6">
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
                                            <div className="flex items-center space-x-4 w-full md:w-auto">
                                                <div className="bg-slate-100 px-4 py-2 rounded-xl text-center">
                                                    <span className="text-xs text-slate-500 block font-medium">Total</span>
                                                    <span className="text-lg font-bold">{students.length}</span>
                                                </div>
                                                <div className="bg-emerald-50 px-4 py-2 rounded-xl text-center border border-emerald-100">
                                                    <span className="text-xs text-emerald-600 block font-medium">Present</span>
                                                    <span className="text-lg font-bold text-emerald-700">{presentCount}</span>
                                                </div>
                                                <div className="bg-rose-50 px-4 py-2 rounded-xl text-center border border-rose-100">
                                                    <span className="text-xs text-rose-600 block font-medium">Absent</span>
                                                    <span className="text-lg font-bold text-rose-700">{absentCount}</span>
                                                </div>
                                            </div>

                                            <div className="flex flex-wrap gap-2 w-full md:w-auto justify-end">
                                                <button onClick={handleAutoPresentAll} className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow-sm">
                                                    Auto Present All
                                                </button>
                                                <button onClick={handleSilentAbsentAll} className="px-3.5 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-semibold shadow-sm">
                                                    Mark All Absent
                                                </button>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                            <div className="p-4 border-b border-slate-100 bg-slate-50 flex items-center justify-between gap-4">
                                                <input
                                                    type="text"
                                                    placeholder="Search roll no or name..."
                                                    value={searchQuery}
                                                    onChange={(e) => setSearchQuery(e.target.value)}
                                                    className="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 w-64"
                                                />
                                                <span className="text-xs text-slate-500 font-medium">Showing {filteredStudents.length} Students</span>
                                            </div>

                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left border-collapse text-sm">
                                                    <thead>
                                                        <tr className="bg-slate-50 text-slate-500 text-xs font-semibold uppercase border-b border-slate-200">
                                                            <th className="py-3 px-6">#</th>
                                                            <th className="py-3 px-6">Roll Number</th>
                                                            <th className="py-3 px-6">Student Name</th>
                                                            <th className="py-3 px-6 text-center">Face Profile</th>
                                                            <th className="py-3 px-6 text-center">Status</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {filteredStudents.map((s, idx) => (
                                                            <tr key={s.roll} className="hover:bg-slate-50">
                                                                <td className="py-3 px-6 text-slate-400 text-xs">{idx + 1}</td>
                                                                <td className="py-3 px-6 font-semibold font-mono text-indigo-700">{s.roll}</td>
                                                                <td className="py-3 px-6 font-medium text-slate-700">{s.name}</td>
                                                                <td className="py-3 px-6 text-center">
                                                                    {s.faceDescriptor ? (
                                                                        <button
                                                                            onClick={() => openVerificationModal(s)}
                                                                            className="px-2.5 py-1 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-md text-xs font-semibold border border-indigo-200"
                                                                        >
                                                                            Verify via Camera 📷
                                                                        </button>
                                                                    ) : (
                                                                        <span className="text-xs text-slate-400 italic">Not Registered</span>
                                                                    )}
                                                                </td>
                                                                <td className="py-3 px-6 text-center">
                                                                    <div className="inline-flex rounded-lg p-0.5 bg-slate-100 border border-slate-200">
                                                                        <button
                                                                            onClick={() => handleStatusChange(s.roll, 'Present')}
                                                                            className={`px-3 py-1 rounded-md text-xs font-semibold transition ${
                                                                                s.status === 'Present' ? 'bg-emerald-600 text-white' : 'text-slate-600'
                                                                            }`}
                                                                        >
                                                                            Present
                                                                        </button>
                                                                        <button
                                                                            onClick={() => handleStatusChange(s.roll, 'Absent')}
                                                                            className={`px-3 py-1 rounded-md text-xs font-semibold transition ${
                                                                                s.status === 'Absent' ? 'bg-rose-600 text-white' : 'text-slate-600'
                                                                            }`}
                                                                        >
                                                                            Absent
                                                                        </button>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t border-slate-200 py-4 mt-auto">
                        <div className="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400">
                            Department of Artificial Intelligence • II B.Tech - I SEM A-Section
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
